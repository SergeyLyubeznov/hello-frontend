<div class="page">
  <nav class="breadcrumb" aria-label="Breadcrumb">
    <a [routerLink]="boardLink()">Board</a>
    <span aria-hidden="true">/</span>
    <a [routerLink]="['/tasks', id]">T-{{ id }}</a>
    <span aria-hidden="true">/</span>
    <span class="breadcrumb__current">Edit</span>
  </nav>

  <h1 class="page__title">Edit task</h1>

  @switch (state()) {
    @case ('loading') {
      <p class="muted">Loading task…</p>
    }
    @case ('not-found') {
      <p class="muted">Task not found. <a routerLink="/board">Back to the board</a></p>
    }
    @case ('error') {
      <p class="muted">Could not load the task. Try again later.</p>
    }
    @case ('ready') {
      @if (initialValue(); as value) {
        <app-task-form
          [initialValue]="value"
          submitLabel="Save changes"
          [saving]="saving()"
          [errorMessage]="errorMessage()"
          (submitted)="onSubmit($event)"
        />
      }
    }
  }
</div>
