<div class="page">
  <nav class="breadcrumb" aria-label="Breadcrumb">
    <a routerLink="/board">Board</a>
    <span aria-hidden="true">/</span>
    <span class="breadcrumb__current">New task</span>
  </nav>

  <h1>New task</h1>

  <form class="form" [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="card">
      <div class="field">
        <label for="title">Title</label>
        <input
          id="title"
          class="field__title"
          type="text"
          formControlName="title"
          placeholder="What needs to be done?"
        />
        @if (form.controls.title.touched && form.controls.title.hasError('required')) {
          <p class="error">Title is required</p>
        }
        @if (form.controls.title.hasError('maxlength')) {
          <p class="error">Title is too long (max 100 characters)</p>
        }
      </div>

      <div class="field">
        <label for="description">Description</label>
        <textarea
          id="description"
          rows="7"
          formControlName="description"
          placeholder="Add details, links or acceptance criteria"
        ></textarea>
      </div>

      <div class="field">
        <label for="status">Status</label>
        <select id="status" formControlName="status">
          @for (s of statuses; track s.status) {
            <option [value]="s.status">{{ s.title }}</option>
          }
        </select>
      </div>
    </div>

    @if (errorMessage()) {
      <p class="error" role="alert">{{ errorMessage() }}</p>
    }

    <div class="actions">
      <a routerLink="/board" class="btn">Cancel</a>
      <button type="submit" class="btn btn--primary" [disabled]="saving()">Create task</button>
    </div>
  </form>
</div>
